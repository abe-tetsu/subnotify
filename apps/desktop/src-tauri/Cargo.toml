[package]
name = "tauri-appsubnotify"
version = "0.1.0"
description = "Desktop control panel for Subnotify"
authors = ["abetetsuya"]
edition = "2021"

[lib]
name = "tauri_appsubnotify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
serde_json = "1"
